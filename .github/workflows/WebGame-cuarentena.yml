name: ABC Gaming - Web Game PS4 (Quarantine)

on:
  schedule:
    - cron: "15 9 * * *"   # 06:15 en Uruguay
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-webgame-ps4:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar scraper Web Game PS4
        run: |
          python webgame_ps4.py

      - name: Mostrar log
        if: always()
        run: |
          echo "===== LOG WEB GAME PS4 ====="
          cat data/quarantine/webgame_ps4/webgame_ps4.log || true

      - name: Mostrar resultado JSON
        if: always()
        run: |
          echo "===== JSON WEB GAME PS4 ====="
          cat data/quarantine/webgame_ps4/webgame_ps4.json || true

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/quarantine/webgame_ps4/

          git diff --cached --quiet || git commit -m "Actualizar cuarentena Web Game PS4"

          git push
