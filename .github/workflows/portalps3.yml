name: portalgames-ps3

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/portalps3.py"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Instalar Chrome real y xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          playwright install --with-deps chrome

      - name: Ejecutar PortalGames
        env:
          HEADLESS: "0"
          REAL_CHROME: "1"
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python portalps3.py

      - name: Mostrar log
        if: always()
        run: cat portalgames_test_2categorias.log.txt || true

      - name: Guardar archivos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portalgames-resultados
          path: |
            portalgames_test_2categorias.log.txt
            portalgames_test_2categorias.csv
            portalgames_productos.csv
            portalgames_state.json
          if-no-files-found: ignore
