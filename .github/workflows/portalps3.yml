name: PortalGames PS3 - Anime Playwright

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  portalgames-ps3:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ======================================================
      # DEPENDENCIAS
      # ======================================================

      - name: Instalar dependencias

        run: |

          python -m pip install --upgrade pip

          pip install playwright beautifulsoup4


      # ======================================================
      # CHROMIUM
      # ======================================================

      - name: Instalar Chromium

        run: |

          python -m playwright install chromium --with-deps


      # ======================================================
      # EJECUTAR
      # ======================================================

      - name: Ejecutar PortalGames

        run: |

          python portalps3.py


      # ======================================================
      # MOSTRAR RESULTADO
      # ======================================================

      - name: Mostrar log

        if: always()

        run: |

          echo "===================================="

          echo "PORTALGAMES LOG"

          echo "===================================="

          cat portalps3_anime.log.txt || true


      # ======================================================
      # GUARDAR RESULTADOS
      # ======================================================

      - name: Guardar archivos

        if: always()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add portalps3_anime_debug.html || true

          git add portalps3_anime_texto.txt || true

          git add portalps3_anime.csv || true

          git add portalps3_anime.log.txt || true


          git diff --cached --quiet || git commit -m "PortalGames PS3 Anime - prueba Playwright"


          git push || true
