name: ABC Gaming - Catálogo diario

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests playwright rapidfuzz beautifulsoup4

      - name: Instalar navegador para Playwright
        run: |
          playwright install --with-deps chromium

      # --- 1. Scraping ---
      - name: Correr el scraper
        run: |
          python scraper.py

      # --- 2. Filtrar tendencias ---
      - name: Filtrar lo más vendible (tendencias)
        run: |
          python filtro_vendibles.py --catalogo catalogo_completo_abc_gaming.xlsx
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}

      # --- 3. Clasificación comercial ---
      - name: Clasificar catálogo y calcular score comercial
        run: |
          python filtrar_catalogo_abc_gaming_CORREGIDO.py

      # --- 4. Subir resultados como artifact ---
      - name: Subir catálogos generados
        uses: actions/upload-artifact@v4
        with:
          name: catalogos-${{ github.run_number }}
          path: |
            catalogo_completo_abc_gaming.xlsx
            catalogo_completo_abc_gaming.csv
            reporte_corrida.csv
            vendibles.csv
            posts_redes.txt
            demanda_abc_gaming.csv
            ABC_Gaming_filtrado/
          retention-days: 14

      # --- 5. Publicar CSV en data/ ---
      - name: Publicar CSV en el repo (carpeta data/)
        run: |
          mkdir -p data

          cp vendibles.csv data/ 2>/dev/null || true
          cp demanda_abc_gaming.csv data/ 2>/dev/null || true
          cp ABC_Gaming_filtrado/*.csv data/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Sin cambios en los catálogos, no hay nada para commitear."
          else
            git commit -m "Actualizar catálogos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
