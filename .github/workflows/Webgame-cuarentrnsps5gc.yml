name: ABC Gaming - Web Game PS5 + GiftCards (Quarantine)

on:
  schedule:
    - cron: "30 9 * * *"   # 06:30 en Uruguay
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-webgame-quarantine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 curl_cffi playwright
          playwright install --with-deps chromium

      - name: Ejecutar scraper Web Game PS5
        continue-on-error: true
        run: |
          python webgame_ps5.py

      - name: Mostrar resultado PS5
        if: always()
        run: |
          echo "===== LOG WEB GAME PS5 ====="
          cat data/quarantine/webgame_ps5/webgame_ps5.log || true

          echo "===== JSON WEB GAME PS5 ====="
          cat data/quarantine/webgame_ps5/webgame_ps5.json || true

      - name: Ejecutar scraper Web Game GiftCards
        continue-on-error: true
        run: |
          python webgame_giftcards.py

      - name: Mostrar resultado GiftCards
        if: always()
        run: |
          echo "===== LOG WEB GAME GIFTCARDS ====="
          cat data/quarantine/webgame_giftcards/webgame_giftcards.log || true

          echo "===== JSON WEB GAME GIFTCARDS ====="
          cat data/quarantine/webgame_giftcards/webgame_giftcards.json || true

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/quarantine/webgame_ps5/
          git add data/quarantine/webgame_giftcards/

          git diff --cached --quiet || git commit -m "Actualizar cuarentena Web Game PS5 y GiftCards"

          git push
