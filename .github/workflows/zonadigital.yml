
name: ZonaDigital - Prueba de scraper

on:
  workflow_dispatch:
  push:
    paths:
      - "scrapers/zonadigital.py"
      - ".github/workflows/zonadigital.yml"

permissions:
  contents: read

jobs:
  probar-zonadigital:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Ejecutar scraper de prueba
        run: python -u scrapers/zonadigital.py
        
